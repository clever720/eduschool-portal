name: EduCore Secure - CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: educore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate School Portal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Verify project files
        run: |
          test -f package.json || {
            echo "ERROR: package.json is missing."
            exit 1
          }

          test -f server/src/index.js || {
            echo "ERROR: Server entry point is missing."
            exit 1
          }

          echo "Project files verified."

      - name: Validate package scripts
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.scripts || !p.scripts.start) {
              console.error('ERROR: Missing start script.');
              process.exit(1);
            }
            if (p.scripts.start !== 'node server/src/index.js') {
              console.error('ERROR: Unexpected start command.');
              process.exit(1);
            }
            console.log('Start script verified.');
          "

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          find server -type f -name '*.js' -print0 |
            xargs -0 -r -n 1 node --check

          echo "JavaScript syntax checks passed."

      - name: Verify server dependencies
        run: |
          npm ls --depth=0

      - name: Report validation result
        if: success()
        run: |
          echo "EduCore Secure validation passed."
          echo "Ready for deployment testing."
